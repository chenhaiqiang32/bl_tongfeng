<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />

  <title>通风三维 Demo</title>
  <link rel="stylesheet" href="https://unpkg.com/element-plus@2.4.1/dist/index.css" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    #app {
      width: 100%;
      height: 100%;
    }

#iframe {
  position: absolute;
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  border: 0;
}



.contentTop {
  display: block;
  position: fixed;
  z-index: 1;
  right: 20%;
  top: 20%;
  width: auto;
  height: auto;
  padding: 20px;
  background: linear-gradient(
    180deg,
    rgba(38, 98, 166, 0.4) 0%,
    rgba(15, 46, 94, 0.4) 100%
  );
  box-shadow: 0px 9px 17px 4px rgba(0, 0, 0, 0.5);
  border: 1px solid;
  border-image: linear-gradient(
      270deg,
      rgba(69, 83, 100, 1),
      rgba(174, 201, 233, 1),
      rgba(69, 83, 100, 1)
    )
    1 1;
  backdrop-filter: blur(20px);
}
.contentNei {
  color: #fff;
  margin-bottom: 12px;
}
.contentNei span {
  width: 64px;
  height: 16px;
  font-size: 16px;
  font-family: SourceHanSansCN, SourceHanSansCN;
  font-weight: 400;
  color: #c0ddef;
  line-height: 24px;
}
.contentNei em {
  width: 38px;
  height: 22px;
  font-size: 16px;
  font-family: AlibabaPuHuiTiM;
  color: #19e7ff;
  line-height: 22px;
}

  </style>
</head>
